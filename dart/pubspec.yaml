name: ai_sdk
description: Adaptive AI Agent Engine - An adaptive, personalized AI automation platform for mobile applications.
version: 1.0.0
homepage: https://github.com/EswarVarma91/ai_sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_remote_config: ^4.3.4
  firebase_analytics: ^9.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.ai_sdk
        pluginClass: AiSdkPlugin
      ios:
        pluginClass: AiSdkPlugin
